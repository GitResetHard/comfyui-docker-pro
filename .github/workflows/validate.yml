name: Validate
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose validation (both standalone files)
        run: |
          test ! -e compose.yaml
          docker compose --env-file .env.example -f docker-compose.yml config --quiet
          docker compose -f docker-compose.zimaos.yml config --quiet
      - name: Bash syntax
        run: bash -n scripts/entrypoint.sh
      - name: Check startup and documentation
        run: |
          test "$(grep -c '^CMD ' Dockerfile)" -eq 1
          grep -q -- '--enable-manager' Dockerfile
          grep -q -- 'manager_requirements.txt' Dockerfile
          grep -q 'ZIMAOS.md' README.md
          test -f ZIMAOS.md
          grep -q 'docker-compose.zimaos.yml' ZIMAOS.md
          ! grep -q ':edge' .env.example
