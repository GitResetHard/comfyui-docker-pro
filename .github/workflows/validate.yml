name: Validate
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose syntax
        run: docker compose --env-file .env.example config -q
      - name: Bash syntax
        run: bash -n scripts/entrypoint.sh
      - name: Dockerfile checks
        run: |
          test "$(grep -c '^CMD ' Dockerfile)" -eq 1
          grep -q -- '--enable-manager' Dockerfile
          grep -q -- 'manager_requirements.txt' Dockerfile
