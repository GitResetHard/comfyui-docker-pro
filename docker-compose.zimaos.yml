name: comfyui

services:
  comfyui:
    image: ghcr.io/gitresethard/comfyui-docker-pro:v1.0.2
    container_name: comfyui
    hostname: comfyui
    restart: unless-stopped
    # To enable the legacy Manager UI, uncomment the final command argument below
    # in the ZimaOS custom app YAML editor. No .env file is needed.
    command:
      - python
      - main.py
      - --listen
      - 0.0.0.0
      - --port
      - "8188"
      - --base-directory
      - /data
      - --enable-manager
      # - --enable-manager-legacy-ui
    stop_grace_period: 90s
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    ports:
      - "8188:8188"
    environment:
      TZ: Europe/Istanbul
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - type: bind
        source: /DATA/AppData/comfyui
        target: /data
        bind:
          create_host_path: true
    shm_size: 1gb
    pids_limit: 1024
    mem_limit: 12g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=8)"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5

x-casaos:
  main: comfyui
  author: GitResetHard
  category: AI
  store_app_id: comfyui-docker-pro
  index: /
  port_map: "8188"
  scheme: http
  hostname: ""
  is_uncontrolled: false
  icon: https://avatars.githubusercontent.com/u/166579949?v=4
  title:
    en_us: ComfyUI Docker Pro
  tagline:
    en_us: Node-based AI image and video generation
  description:
    en_us: ComfyUI with NVIDIA GPU acceleration and built-in ComfyUI Manager.
