name: comfyui

services:
  comfyui:
    image: ${COMFY_IMAGE:-comfyui-docker-pro:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMFY_REF: ${COMFY_REF:-master}
    restart: unless-stopped
    stop_grace_period: 90s
    gpus: all
    ports:
      - "${COMFY_BIND:-127.0.0.1}:${COMFY_PORT:-8188}:8188"
    environment:
      TZ: ${TZ:-UTC}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      COMFY_EXTRA_ARGS: ${COMFY_EXTRA_ARGS:-}
    volumes:
      - comfy-data:/data
    shm_size: ${COMFY_SHM_SIZE:-1gb}
    pids_limit: ${COMFY_PIDS_LIMIT:-1024}
    mem_limit: ${COMFY_MEM_LIMIT:-12g}
    mem_reservation: ${COMFY_MEM_RESERVATION:-4g}
    logging:
      driver: json-file
      options:
        max-size: "${COMFY_LOG_MAX_SIZE:-20m}"
        max-file: "${COMFY_LOG_MAX_FILES:-5}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=8)"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5

volumes:
  comfy-data:
