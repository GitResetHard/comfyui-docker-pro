name: comfyui
services:
  comfyui:
    build:
      context: .
      args:
        COMFY_REF: ${COMFY_REF:-master}
    image: ${COMFY_IMAGE:-comfyui-local:latest}
    container_name: comfyui
    restart: unless-stopped
    gpus: all
    ports:
      - "${COMFY_BIND:-0.0.0.0}:${COMFY_PORT:-8188}:8188"
    volumes:
      - ${COMFY_DATA:-./data}:/data
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    security_opt:
      - no-new-privileges:true
    shm_size: 1gb
    stop_grace_period: 60s
